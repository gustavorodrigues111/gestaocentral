# Compila o app da maquininha (android-v2s/) e publica o APK como artefato.
# Rodar: aba Actions do GitHub > "APK maquininha V2s" > Run workflow,
# ou automaticamente quando algo em android-v2s/ muda na main.
name: APK maquininha V2s

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android-v2s/**", ".github/workflows/android-v2s.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compilar
        run: gradle -p android-v2s assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: planejamento-v2s-apk
          path: android-v2s/app/build/outputs/apk/release/*.apk
