<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link id="__favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão Central</title>

    <!-- Detecta host de restaurante (lobozo.com.br, etc) e atualiza
         favicon + title ANTES do React montar. Lê /sites/<slug>.json
         (gerado pelo SSG, servido pela CDN, ~50ms). Sem isso, o browser
         cacheia o favicon default e ignora updates posteriores feitos
         via React useEffect. -->
    <script>
      (function() {
        var host = window.location.hostname.toLowerCase();
        // Mapeamento simplificado — espelha src/modules/sites/shared/customDomain.ts.
        // Se adicionar restaurante novo, atualizar aqui também.
        var hosts = {
          "lobozo.com.br":     "lobozo",
          "www.lobozo.com.br": "lobozo",
        };
        var slug = hosts[host];
        if (!slug) return;
        // Tenta o JSON pré-renderizado (CDN-cached, instante). Se falhar,
        // o React vai cuidar via useEffect depois.
        fetch("/sites/" + slug + ".json", { cache: "default" })
          .then(function(r) { return r.ok ? r.json() : null; })
          .then(function(cfg) {
            if (!cfg) return;
            var favUrl = cfg.faviconUrl || cfg.logoUrl;
            if (favUrl) {
              var link = document.getElementById("__favicon");
              if (link) {
                link.href = favUrl;
                link.removeAttribute("type"); // pode não ser SVG
              }
            }
            // Atualiza title (cliente vê o nome certo na aba enquanto carrega)
            if (cfg.slug) {
              var nome = cfg.slug.charAt(0).toUpperCase() + cfg.slug.slice(1);
              document.title = nome;
            }
          })
          .catch(function() { /* silencioso — fallback no React */ });
      })();
    </script>

    <!-- Preconnect — abre a conexão TCP/TLS pros hosts críticos antes
         do JS executar. Economiza ~200-400ms na 1ª request pra cada
         um deles. Particularmente importante em mobile 4G/3G. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fallback de fonte do hero ANTES do React montar (evita FOUT
         visível). DM Serif Display + Inter cobrem ~80% dos sites. -->
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" />

    <!-- Splash screen — aparece antes do JS hidratar. Bege neutro do
         template padrão. Evita "flash" branco na primeira renderização
         em mobile lento. -->
    <style>
      html, body {
        margin: 0; padding: 0;
        background: #f7f3e9;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      #root:empty::before {
        content: '';
        display: block;
        min-height: 100vh;
        background: #f7f3e9;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
