     <li><strong>Segunda ocorrência · nova conversa</strong><p>Ainda sem documento formal, agora com registro. É o momento de verificar se o problema é de conduta ou de treinamento: erro que se repete após duas orientações às vezes indica que a instrução nunca foi clara.</p></li>
     <li><strong>Reincidência · rito formal</strong><p>Advertência escrita, depois suspensão e, persistindo, eventual justa causa. Cada etapa gera documento assinado, solicitado pela liderança e aprovado por Gustavo.</p><div class="who"><span class="ex">liderança solicita</span><span class="ap">Gustavo</span></div></li>
    </ol>
    <div class="rule"><b class="h">Havendo má-fé, o rito começa de imediato</b><p>Furto, agressão, fraude no registro de ponto e conduta que exponha colega ou cliente não passam pela fase de conversa. A orientação prévia pressupõe erro, não intenção.</p></div>`},

   {i:'⚖️', t:'Isonomia no rito', d:`
    <div class="rule"><b class="h">O rito não depende de má-fé</b><p>Se uma pessoa recebeu advertência por determinado erro, outra que cometa o mesmo erro também recebe — independente de quem seja, do tempo de casa ou da relação com a liderança.</p></div>
    <h5>Verificação antes de aplicar</h5>
    <ul>
     <li>Consultar a Trilha para saber se houve caso equivalente antes e qual foi o desfecho.</li>
     <li>Confirmar que a ocorrência está registrada com data e descrição objetiva do fato, não com juízo sobre a pessoa.</li>
     <li>Levar a Gustavo com esse histórico. A aprovação é dele; a instrução do caso é do DP.</li>
    </ul>
    <p>A razão jurídica é direta: em reclamatória, demonstrar que outro empregado cometeu a mesma falta sem sofrer a mesma consequência costuma derrubar a penalidade discutida.</p>
    <div class="imp-box"><span class="kind">falta no sistema</span><b class="h">Melhoria</b><p>Não existe módulo de Advertências. Hoje a advertência é apenas um <i>tipo de evento</i> na Trilha, sem geração do documento. O desejável é que ela nasça no sistema, com o termo redigido pela advocacia, e alimente a Trilha automaticamente.</p></div>`},

   {i:'🚫', t:'Justa causa', d:`
    <p class="lead">Modalidade rara, com rito próprio, sempre conduzida com a contabilidade e a advocacia.</p>
    <p>Pode ser aplicada mesmo havendo <b>risco conhecido de reversão judicial</b>, quando a conduta foi presenciada pela equipe e deixá-la sem resposta comprometeria a regra para todos. Essa ponderação é decisão da direção, não da área.</p>
    <div class="rule"><b class="h">O que a área precisa garantir</b><p>Base documental. Justa causa sem histórico registrado — advertências anteriores, ocorrências com data, documentos assinados — dificilmente se sustenta em juízo. É aqui que a Trilha do Empregado deixa de ser controle interno e passa a ser peça de defesa.</p></div>
    <h5>Preferência da direção</h5>
    <p>Intervir cedo. Depois da advertência escrita a relação muda: a pessoa se sente marcada, a liderança passa a observar de perto e cresce a probabilidade de o desligamento terminar em reclamatória. Tratar a primeira ocorrência em conversa costuma resolver o mesmo problema sem esse custo.</p>`}
 ]}
]},

{g:'Processos', i:'🦺', t:'Saúde e equipamentos', d:`
  <p class="lead">Obrigações de cumprimento contínuo, geridas por vencimento e não por demanda: exames ocupacionais e entrega de uniformes e EPIs.</p>
  <p>Distinguem-se do resto da área num ponto: não produzem resultado visível quando estão em dia. Exame válido e EPI dentro do prazo não aparecem para ninguém — aparecem na fiscalização, no acidente ou na reclamatória, e nesse momento o que se verifica é a data, não o esforço.</p>
  <p>Por isso o trabalho aqui é manter o cadastro correto e responder aos avisos de vencimento que chegam à Central. Com o cadastro em ordem, a área se conduz praticamente sozinha.</p>`, c:[

 {i:'🩺', t:'Exames médicos', d:`
  <p class="lead">Controle dos exames obrigatórios por cargo, com agendamento, baixa do resultado e cálculo automático do próximo vencimento. Módulo <b>Exames Médicos</b>.</p>
  <h5>Os dois tipos</h5>
  <p><b>Ocupacional</b>, previsto na CLT e conduzido conforme o PCMSO: exame <b>admissional</b> antes do início das atividades, <b>periódico</b> em geral anual, <b>demissional</b> no encerramento do vínculo, além dos exames de mudança de função e de retorno ao trabalho.</p>
  <p><b>Parasitológico</b>, exigido de quem manipula alimentos — coprocultura e correlatos, com periodicidade própria definida no cadastro do tipo de exame.</p>
  <h5>Como o módulo opera</h5>
  <p>A aba <b>Por empregado</b> cruza cada pessoa ativa com os exames aplicáveis ao seu cargo e área, exibindo quatro status: <b>falta</b>, <b>vencido</b>, <b>a vencer</b> (dentro de 30 dias) e <b>em dia</b>.</p>
  <ol class="steps">
     <li><strong>Agendar</strong><p>Junto ao fornecedor cadastrado, conforme a praça da empresa.</p></li>
     <li><strong>Lançar o exame</strong><p>Informa-se data e fornecedor; o sistema calcula o próximo vencimento somando a periodicidade do tipo.</p></li>
     <li><strong>Anexar o resultado</strong><p>O PDF é vinculado à pasta do empregado no Drive.</p></li>
  </ol>
  <p>A configuração dos tipos de exame — periodicidade, antecedência do alerta, cargos e áreas obrigatórios — é de acesso master. Desligamento e mudança de área desativam automaticamente os exames que deixam de ser aplicáveis.</p>
  <div class="imp-box"><span class="kind">carga de dados</span><b class="h">Melhoria</b><p>A ferramenta está implantada, mas o cadastro não reflete a realidade. Falta o levantamento inicial dos exames vigentes de toda a equipe — data de realização e vencimento — para que o controle passe a ser feito pelo sistema. Enquanto isso não ocorre, os alertas não são confiáveis.</p></div>`},

 {i:'🦺', t:'Uniformes e EPIs', d:`
  <p class="lead">Catálogo, estoque, entregas, devoluções e vencimentos, organizados a partir do <b>kit mínimo por área</b>. Módulo <b>Uniformes &amp; EPIs</b>.</p>
  <h5>O kit por área</h5>
  <p>Cada área — cozinha, salão, bar, limpeza — tem um kit mínimo definido em configuração: quais peças de uniforme e quais equipamentos de proteção a pessoa precisa receber. Esse kit é a base do que se entrega na etapa <i>Última milha</i> da admissão.</p>
  <h5>Entrega e devolução</h5>
  <ol class="steps">
     <li><strong>Registrar a entrega</strong><p>Item, variação e quantidade, com baixa no estoque. O sistema gera o <b>termo de responsabilidade em PDF</b>.</p></li>
     <li><strong>Coletar a assinatura</strong><p>O termo assinado é arquivado na pasta do empregado.</p></li>
     <li><strong>Acompanhar a validade</strong><p>EPI tem prazo de validade e vida útil. O módulo sinaliza os itens que vencem em 30 dias, por empregado.</p></li>
     <li><strong>Registrar a devolução</strong><p>No desligamento ou na troca por item novo, com o registro correspondente.</p></li>
  </ol>
  <div class="rule"><b class="h">Por que o termo assinado importa</b><p>Em fiscalização e em discussão sobre acidente de trabalho, o que se exige da empresa é a prova de que forneceu o equipamento adequado, no prazo, e de que a pessoa o recebeu. Entrega sem termo assinado equivale, do ponto de vista documental, a entrega não realizada.</p></div>
  <div class="imp-box"><span class="kind">carga de dados</span><b class="h">Melhoria</b><p>Assim como nos exames, falta a carga inicial: o que cada pessoa já recebeu, quando, e a validade dos EPIs em uso. Sem isso o controle de vencimento não opera.</p></div>`}
]}

];
</script>
<script>
(function(){
const screens=document.getElementById('screens'),
      bar={up:document.getElementById('up'),now:document.getElementById('now')},
      back=document.getElementById('back');

/* ── preparar a árvore ── */
const ALL=[];
(function prep(n,d,p){
  n.uid=ALL.length+1;n.depth=d;n.parent=p;n.c=n.c||[];
  n.own=(n.d||'').split('imp-box').length-1;
  ALL.push(n); n.c.forEach(k=>prep(k,d+1,n));
  n.tot=n.own+n.c.reduce((a,k)=>a+k.tot,0);
  n.hay=(n.t+' '+(n.d||'')).replace(/<[^>]+>/g,' ').toLowerCase();
})(T,0,null);
document.getElementById('rmc').textContent=T.tot;

/* resumo de uma linha, tirado da abertura do texto */
function gist(n){
  const lead=(n.d||'').match(/class="lead">([\s\S]*?)<\/p>/);
  let t=lead?lead[1]:(n.d||'');
  t=t.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  if(!t)return n.c.length?n.c.map(k=>k.t).join(' · '):'';
  const m=t.match(/^[^.!?]+[.!?]?/), s=m?m[0]:t;
  return s.length>108?s.slice(0,106)+'…':s;
}
function trail(n){const a=[];let p=n.parent;while(p&&p.depth>0){a.unshift(p.t);p=p.parent;}return a.join(' › ');}

/* ── pilha de telas ── */
const stack=[];
let useHist=true;
try{history.replaceState({u:1},'',location.hash||'#1');}catch(e){useHist=false;}
function hpush(u){if(!useHist)return;try{history.pushState({u:u},'','#'+u);}catch(e){useHist=false;}}
function hback(){if(useHist){try{history.back();return;}catch(e){useHist=false;}}pop();}

function mk(html){
  const d=document.createElement('div');
  d.className='s out-r';d.innerHTML=html;screens.appendChild(d);
  d.getBoundingClientRect();
  requestAnimationFrame(()=>d.classList.remove('out-r'));
  return d;
}
function push(node){
  if(stack.length)stack[stack.length-1].el.classList.add('out-l');
  const el=mk(view(node));
  stack.push({node,el}); wire(el); head(); hpush(node.uid);
}
function pop(){
  if(stack.length<2)return;
  const t=stack.pop();
  t.el.classList.add('out-r');
  setTimeout(()=>t.el.remove(),300);
  stack[stack.length-1].el.classList.remove('out-l');
  head();
}
function head(){
  const cur=stack[stack.length-1].node;
  document.body.classList.toggle('deep',stack.length>1);
  bar.now.textContent=cur.depth?cur.t:'Processos de Pessoas';
  bar.up.textContent=cur.depth?(trail(cur)||'Mapa de processos'):'Quibebe · escritório';
}

/* ── montagem ── */
function rowsOf(list){
  return list.map(n=>
    '<button class="row'+(n.tot?' has-imp':'')+'" data-go="'+n.uid+'">'+
      '<i>'+(n.i||'•')+'</i>'+
      '<span class="tx"><b>'+n.t+'</b>'+(gist(n)?'<small>'+gist(n)+'</small>':'')+'</span>'+
      (n.tot?'<span class="imp">'+n.tot+'</span>':'')+
      (n.c.length?'<span class="cnt">'+n.c.length+'</span>':'')+
      '<span class="arw">›</span>'+
    '</button>').join('');
}

const GRUPOS=[
  {nome:'Visão geral', desc:'Como o escritório funciona e qual o critério de decisão quando não há processo escrito.'},
  {nome:'Processos',   desc:'As rotinas da área, do ciclo de vida do empregado às obrigações que correm por prazo.'}
];

function home(){
  const fav=['Ponto','Gorjeta','Férias','Desligamento','Admissão','Advertências e justa causa','Banco de horas'];
  const favN=fav.map(t=>ALL.find(n=>n.t===t)).filter(Boolean);
  let h='<div class="sb" id="sbw"><i>⌕</i><input id="q" type="search" placeholder="Buscar processo, regra, prazo…" aria-label="Buscar"><button id="qx" aria-label="Limpar">✕</button></div>'
   + '<div id="res"></div><div id="main">'
   + '<div class="hi"><h1>O que você precisa saber?</h1><p>Processos de Pessoas do escritório — o que se faz, em qual módulo, quem executa e quem aprova.</p></div>'
   + '<div class="lbl">Consulta frequente</div>'
   + '<div class="chips">'+favN.map(n=>'<button class="chip" data-go="'+n.uid+'">'+n.i+' '+n.t+'</button>').join('')+'</div>';
  GRUPOS.forEach(g=>{
    const itens=T.c.filter(n=>n.g===g.nome);
    if(!itens.length)return;
    h+='<div class="lbl">'+g.nome+'<small>'+g.desc+'</small></div>'+rowsOf(itens);
  });
  h+='<div class="foot">Documento vivo, revisado conforme os processos mudam.<br>A camada ◆ marca o que ainda não está implantado.</div></div>';
  return h;
}

function view(n){
  if(n.depth===0)return home();
  let h='';
  if(n.d)h+='<div class="rd">'+n.d+'</div>';
  if(n.c.length)h+='<div class="sub"><div class="lbl">'+(n.depth===1?'Nesta área':'Detalha em')+'</div>'+rowsOf(n.c)+'</div>';
  if(!n.d&&!n.c.length)h+='<div class="empty">Sem conteúdo neste nó.</div>';
  return h;
}
function impList(){
  return '<div class="lbl">Índice de melhorias<small>Todos os pontos marcados ◆ no documento.</small></div>'
    + rowsOf(ALL.filter(n=>n.own>0));
}

/* ── eventos ── */
function wire(el){
  el.querySelectorAll('[data-go]').forEach(b=>{
    b.addEventListener('click',()=>{
      const n=ALL.find(x=>x.uid===+b.dataset.go); if(n)push(n);
    });
  });
  const q=el.querySelector('#q');
  if(!q)return;
  const res=el.querySelector('#res'),main=el.querySelector('#main'),
        sbw=el.querySelector('#sbw'),qx=el.querySelector('#qx');
  function run(){
    const v=q.value.trim().toLowerCase();
    sbw.classList.toggle('has',!!v);
    if(v.length<2){res.innerHTML='';main.style.display='';return;}
    main.style.display='none';
    const hit=ALL.filter(n=>n.depth>0&&n.hay.indexOf(v)>-1);
    res.innerHTML=hit.length
      ? '<div class="lbl">'+hit.length+' resultado'+(hit.length>1?'s':'')+'</div>'+rowsOf(hit)
      : '<div class="empty">Nada encontrado para “'+q.value+'”.<br>Tente uma palavra do processo — <b>gorjeta</b>, <b>atestado</b>, <b>banco de horas</b>.</div>';
    wire(res);
  }
  q.addEventListener('input',run);
  qx.addEventListener('click',()=>{q.value='';run();q.focus();});
}

back.addEventListener('click',hback);
window.addEventListener('popstate',()=>{if(stack.length>1)pop();});

/* deslizar da borda esquerda para voltar */
let sx=0,sy=0,tr=false;
screens.addEventListener('touchstart',e=>{
  if(stack.length<2)return;
  const t=e.touches[0]; if(t.clientX>44)return;
  sx=t.clientX;sy=t.clientY;tr=true;
},{passive:true});
screens.addEventListener('touchend',e=>{
  if(!tr)return;tr=false;
  const t=e.changedTouches[0];
  if(t.clientX-sx>62&&Math.abs(t.clientY-sy)<58)hback();
},{passive:true});

/* camada de roadmap */
const rm=document.getElementById('rm');
rm.addEventListener('click',()=>{
  const on=document.body.classList.toggle('rm');
  rm.setAttribute('aria-pressed',on?'true':'false');
  const box=stack[0].el.querySelector('#main');
  if(!box)return;
  let idx=box.querySelector('#impidx');
  if(on){
    if(!idx){idx=document.createElement('div');idx.id='impidx';idx.innerHTML=impList();box.appendChild(idx);wire(idx);}
    idx.style.display='';
  }else if(idx)idx.style.display='none';
});

/* start */
stack.push({node:T,el:mk(home())});
wire(stack[0].el); head();
try{if(useHist)history.replaceState({u:T.uid},'','#'+T.uid);}catch(e){}
})();
</script>
</body>
</html>
